name: Build and Push

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

env:
  IMAGE_NAME: traineratwot/php

jobs:
  # Нативные раннеры per-arch: amd64 и arm64 параллельно, без QEMU.
  # QEMU arm64 даёт ~5–10× замедление — поэтому 30+ минут.
  build:
    name: ${{ matrix.target }} / ${{ matrix.platform }}
    runs-on: ${{ matrix.platform == 'linux/arm64' && 'ubuntu-24.04-arm' || 'ubuntu-latest' }}
    strategy:
      fail-fast: false
      matrix:
        target: [prod, dev]
        platform: [linux/amd64, linux/arm64]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          target: ${{ matrix.target }}
          platforms: ${{ matrix.platform }}
          outputs: type=image,name=${{ env.IMAGE_NAME }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=${{ matrix.target }}-${{ matrix.platform }}
          cache-to: type=gha,scope=${{ matrix.target }}-${{ matrix.platform }},mode=max

      - name: Export digest
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@v4
        with:
          name: digests-${{ matrix.target }}-${{ strategy.job-index }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  # Склеиваем amd64 + arm64 в multi-arch теги
  merge:
    name: Merge ${{ matrix.target }}
    runs-on: ubuntu-latest
    needs: [build]
    strategy:
      matrix:
        target: [prod, dev]
    steps:
      - name: Download digests
        uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: digests-${{ matrix.target }}-*
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Create multi-arch tags
        working-directory: /tmp/digests
        run: |
          set -eux
          if [ "${{ matrix.target }}" = "prod" ]; then
            docker buildx imagetools create \
              --tag "${IMAGE_NAME}:prod" \
              --tag "${IMAGE_NAME}:latest" \
              $(ls)
          else
            docker buildx imagetools create \
              --tag "${IMAGE_NAME}:dev" \
              $(ls)
          fi

      - name: Inspect
        run: |
          if [ "${{ matrix.target }}" = "prod" ]; then
            docker buildx imagetools inspect "${IMAGE_NAME}:prod"
          else
            docker buildx imagetools inspect "${IMAGE_NAME}:dev"
          fi
